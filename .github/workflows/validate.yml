name: Validate and build modpack

on:
  push:
    paths:
      - "packwiz/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "packwiz/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

jobs:
  discover:
    runs-on: windows-latest
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - id: discover
        name: Discover packwiz versions
        shell: pwsh
        run: |
          $versions = ./scripts/discover-versions.ps1
          "versions=$versions" >> $Env:GITHUB_OUTPUT

  validate-and-build:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.versions) }}
    runs-on: windows-latest
    steps:
      - name: Preserve LF line endings for packwiz hashes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        shell: pwsh
        run: |
          go install github.com/packwiz/packwiz@latest
          Copy-Item (Join-Path (go env GOPATH) 'bin/packwiz.exe') ./packwiz.exe

      - name: Validate (${{ matrix.version }})
        shell: pwsh
        run: ./scripts/validate.ps1 -MinecraftVersion ${{ matrix.version }}

      - name: Verify generated index is committed (${{ matrix.version }})
        shell: pwsh
        run: git diff --exit-code -- packwiz/${{ matrix.version }}/pack.toml packwiz/${{ matrix.version }}/index.toml

      - name: Build Modrinth package (${{ matrix.version }})
        shell: pwsh
        run: ./scripts/pack.ps1 build -Version ${{ matrix.version }}

      - name: Upload package (${{ matrix.version }})
        uses: actions/upload-artifact@v4
        with:
          name: Preliminary-Art-Form-${{ matrix.version }}
          path: dist/*.mrpack
          if-no-files-found: error
